name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Run enclave in debug mode'
        type: boolean
        default: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image_tag: ${{ github.sha }}
      ecr_registry: ${{ steps.get-account.outputs.registry }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS account ID
        id: get-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT
          echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push enclave image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.registry }}
          ENCLAVE_REPO: ${{ vars.PROJECT_NAME }}-enclave
        run: |
          docker build -t $ECR_REGISTRY/$ENCLAVE_REPO:${{ github.sha }} -f data-provider/harness/Dockerfile --target runtime  data-provider/harness
          docker push $ECR_REGISTRY/$ENCLAVE_REPO:${{ github.sha }}
          docker tag $ECR_REGISTRY/$ENCLAVE_REPO:${{ github.sha }} $ECR_REGISTRY/$ENCLAVE_REPO:latest
          docker push $ECR_REGISTRY/$ENCLAVE_REPO:latest

      - name: Build and push webserver image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.registry }}
          WEBSERVER_REPO: ${{ vars.PROJECT_NAME }}-webserver
        run: |
          docker build -t $ECR_REGISTRY/$WEBSERVER_REPO:${{ github.sha }} -f data-provider/Dockerfile data-provider
          docker push $ECR_REGISTRY/$WEBSERVER_REPO:${{ github.sha }}
          docker tag $ECR_REGISTRY/$WEBSERVER_REPO:${{ github.sha }} $ECR_REGISTRY/$WEBSERVER_REPO:latest
          docker push $ECR_REGISTRY/$WEBSERVER_REPO:latest

      - name: Build and push judge image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.registry }}
          JUDGE_REPO: ${{ vars.PROJECT_NAME }}-judge
        run: |
          docker build -t $ECR_REGISTRY/$JUDGE_REPO:${{ github.sha }} -f judge/Dockerfile judge
          docker push $ECR_REGISTRY/$JUDGE_REPO:${{ github.sha }}
          docker tag $ECR_REGISTRY/$JUDGE_REPO:${{ github.sha }} $ECR_REGISTRY/$JUDGE_REPO:latest
          docker push $ECR_REGISTRY/$JUDGE_REPO:latest

      - name: Build and push challenger image
        env:
          ECR_REGISTRY: ${{ steps.get-account.outputs.registry }}
          CHALLENGER_REPO: ${{ vars.PROJECT_NAME }}-challenger
        run: |
          docker build -t $ECR_REGISTRY/$CHALLENGER_REPO:${{ github.sha }} -f challenger/web/Dockerfile challenger/web
          docker push $ECR_REGISTRY/$CHALLENGER_REPO:${{ github.sha }}
          docker tag $ECR_REGISTRY/$CHALLENGER_REPO:${{ github.sha }} $ECR_REGISTRY/$CHALLENGER_REPO:latest
          docker push $ECR_REGISTRY/$CHALLENGER_REPO:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy via SSM
        env:
          INSTANCE_ID: ${{ secrets.INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          DEBUG_MODE: ${{ inputs.debug_mode || 'false' }}
          ENCLAVE_REPO: ${{ vars.PROJECT_NAME }}-enclave
          WEBSERVER_REPO: ${{ vars.PROJECT_NAME }}-webserver
          JUDGE_REPO: ${{ vars.PROJECT_NAME }}-judge
          CHALLENGER_REPO: ${{ vars.PROJECT_NAME }}-challenger
        run: |
          set -e
          echo "Deploying $IMAGE_TAG to instance"
          
          # Build the commands array: set env vars, then run each line of the script
          COMMANDS=$(cat <<'SCRIPT' | jq -R -s -c '
            split("\n") | map(select(length > 0))
          '
          export IMAGE_TAG="$IMAGE_TAG"
          export DEBUG_MODE="$DEBUG_MODE"
          export ENCLAVE_REPO="$ENCLAVE_REPO"
          export WEBSERVER_REPO="$WEBSERVER_REPO"
          export JUDGE_REPO="$JUDGE_REPO"
          export CHALLENGER_REPO="$CHALLENGER_REPO"
          export AWS_REGION="${{ env.AWS_REGION }}"
          SCRIPT
          )
          
          # Append the actual deploy script
          DEPLOY_SCRIPT=$(cat infra/deploy.sh | jq -R -s -c 'split("\n") | map(select(length > 0))')
          DOCKER_COMPOSE=$(cat docker-compose.yml | jq -R -s -c 'split("\n") | map(select(length > 0))')
          
          # Merge the two arrays
          ALL_COMMANDS=$(echo "[$COMMANDS, $DOCKER_COMPOSE, $DEPLOY_SCRIPT]" | jq -c 'flatten')
          
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\": $ALL_COMMANDS}" \
            --timeout-seconds 600 \
            --query 'Command.CommandId' --output text)

          echo "Command ID: $COMMAND_ID"
          echo "Waiting for deployment to complete..."

          # Poll for completion
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            echo "Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo ""
              echo "=========================================="
              echo "Deployment succeeded!"
              echo "=========================================="
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo ""
              echo "=========================================="
              echo "Deployment failed!"
              echo "=========================================="
              echo "STDOUT:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' --output text || true
              echo ""
              echo "STDERR:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' --output text || true
              exit 1
            fi

            sleep 10
          done

          echo "Timeout waiting for deployment"
          exit 1
